# On every version tag (v2.0.0, v2.1.3, …): builds the container image for amd64 and arm64,
# pushes it to the GitHub Container Registry, then publishes a GitHub release with the
# version's changelog section and the Synology ZIP. Deliberately without a test run — the
# tests run locally before every commit.
name: Docker image

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Stops early if the tag doesn't match APP_VERSION/package.json or has no changelog entry
      - run: node scripts/release-notes.js --check "$GITHUB_REF_NAME"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  release:
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/package.js
      - run: node scripts/release-notes.js > notes.md
      - name: Publish release (or attach the ZIP to one created by hand)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ZIP="_exports/l3t-ipam-${GITHUB_REF_NAME#v}-synology.zip"
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$ZIP" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$ZIP" --title "L3T IPAM ${GITHUB_REF_NAME#v}" --notes-file notes.md --verify-tag
          fi
