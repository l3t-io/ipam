# Synology Container Manager — ready-made image, no code upload needed.
# Instructions: SYNOLOGY.md
services:
  l3t-ipam:
    image: ghcr.io/l3t-io/ipam:2
    container_name: l3t-ipam
    restart: unless-stopped
    ports:
      - "8480:8080"
    volumes:
      - /volume1/docker/l3t-ipam/data:/data
    environment:
      # The first Synology user is usually 1026, the group «users» is 100.
      # To check: Control Panel → Terminal & SNMP → SSH, then `id` — or just leave it as is.
      PUID: "1026"
      PGID: "100"
      IPAM_DOMAIN: home.arpa   # enter your own domain, e.g. l3t.io
      IPAM_LANG: de
      TZ: Europe/Zurich
      # Keep enabled behind a Cloudflare Tunnel or the Synology reverse proxy
      IPAM_TRUST_PROXY: "1"
    security_opt:
      - no-new-privileges:true
