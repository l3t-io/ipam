# Synology Container Manager — fertiges Image, kein Code-Upload nötig.
# Anleitung: SYNOLOGY.md
services:
  l3t-ipam:
    image: ghcr.io/l3t-io/ipam:2
    container_name: l3t-ipam
    restart: unless-stopped
    ports:
      - "8480:8080"
    volumes:
      - /volume1/docker/l3t-ipam/data:/data
    environment:
      # Erster Benutzer der Synology ist meist 1026, Gruppe «users» ist 100.
      # Prüfen: Systemsteuerung → Terminal & SNMP → SSH, dann `id` — oder einfach so lassen.
      PUID: "1026"
      PGID: "100"
      IPAM_DOMAIN: home.arpa   # eigene Domain eintragen, etwa l3t.io
      IPAM_LANG: de
      TZ: Europe/Zurich
      # Hinter Cloudflare-Tunnel oder Reverse Proxy der Synology aktiv lassen
      IPAM_TRUST_PROXY: "1"
    security_opt:
      - no-new-privileges:true
