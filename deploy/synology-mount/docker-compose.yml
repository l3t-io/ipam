# Synology Container Manager — without an image build.
# The container starts node:22-alpine and runs the app from the
# mounted folder. No Dockerfile is needed.
services:
  l3t-ipam:
    image: node:22-alpine
    container_name: l3t-ipam
    restart: unless-stopped
    working_dir: /app
    command: node server.js
    ports:
      - "8480:8080"
    volumes:
      - /volume1/docker/l3t-ipam/app:/app:ro
      - /volume1/docker/l3t-ipam/data:/data
    environment:
      IPAM_DATA: /data
      IPAM_DOMAIN: home.arpa   # enter your own domain, e.g. l3t.io
      IPAM_LANG: de            # language of the log (de or en)
      TZ: Europe/Zurich
      # Login: on first start, the log shows a setup code.
      # Use it to create your account in the browser. Nothing to enter here.
      #
      # If access goes through a Cloudflare Tunnel or the Synology reverse proxy,
      # keep this line enabled: lockouts after failed attempts then count per real
      # client address, and the cookie is marked «Secure» on HTTPS.
      IPAM_TRUST_PROXY: "1"
      # The UniFi connection is set up in the UI (gear icon, top right)
      # and stored in data/unifi.json. Nothing to enter here for it any more.
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      start_period: 10s
